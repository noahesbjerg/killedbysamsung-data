name: Suggest an entry or correction
description: Share a Samsung retirement or correct a catalogue entry.
title: "[Catalogue] "
body:
  - type: input
    id: product
    attributes:
      label: Product or feature name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What ended or needs correcting?
      description: Include the date, market and affected devices when known.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source link
      description: A Samsung notice, partner announcement or report quoting the notice.
    validations:
      required: true
